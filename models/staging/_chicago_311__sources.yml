version: 2

sources:
  - name: chicago_311
    description: >
      Raw Chicago 311 non-emergency service requests, loaded from the
      City of Chicago Socrata Open Data API (dataset v6vf-nfxy) into
      BigQuery by the ingestion script in /ingestion.
    database: jaffleshop-500219   # GCP project
    schema: chicago_311_raw       # raw landing dataset the loader writes to

    # Source freshness: the city updates this dataset daily. We measure
    # freshness off last_modified_date, which advances whenever any request
    # is updated. Thresholds are generous because the published feed lags.
    config:
      freshness:
        warn_after:
          count: 36
          period: hour
        error_after:
          count: 72
          period: hour
      loaded_at_field: "CAST(last_modified_date AS TIMESTAMP)"

    tables:
      - name: service_requests
        description: >
          One row per 311 service request. STATUS mutates in place
          (Open -> Completed, plus duplicate labeling) on a stable
          sr_number, which makes this table a good SCD-2 snapshot target.
        columns:
          - name: sr_number
            description: Unique service request identifier (natural key).
            data_tests:
              - not_null
