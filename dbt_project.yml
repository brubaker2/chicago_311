name: 'chicago_311'
version: '1.0.0'
config-version: 2

# This setting configures which "profile" dbt uses for this project.
# In the dbt platform this maps to the connection you configured in the UI.
profile: 'chicago_311'

# These configs specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Layered materialization conventions:
#   staging      -> views (cheap, always fresh, 1:1 with source)
#   intermediate -> ephemeral (compiled inline, not persisted)
#   marts        -> tables (queryable, durable)
models:
  chicago_311:
    staging:
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +materialized: table
      +schema: marts

# Snapshots capture SCD-2 history of the 311 requests as STATUS mutates.
snapshots:
  chicago_311:
    +target_schema: snapshots
